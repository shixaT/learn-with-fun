<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn with Fun</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Learn with Fun</h1>
        <p>Helping 1st graders learn to read, write, and do math!</p>
    </header>
    <main>
        <section id="reading">
            <h2>Reading</h2>
            <p>Match the letters to their sounds!</p>
            <div id="reading-activity"></div>
        </section>
        <section id="writing">
            <h2>Writing</h2>
            <p>Trace the letters!</p>
            <canvas id="writing-canvas" width="400" height="200"></canvas>
        </section>
        <section id="math">
            <h2>Math</h2>
            <p>Solve these simple problems!</p>
            <div id="math-activity"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Learn with Fun</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
